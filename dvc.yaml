stages:
  data_cleaning:
    cmd: python -m src.data.data_cleaning
    deps:
      - src/data/data_cleaning.py
      - data/raw/swiggy.csv
    params:
      - data_cleaning
    outs:
      - data/interim/swiggy_cleaned.csv

  data_preparation:
    cmd: python -m src.data.data_preparation
    deps:
      - src/data/data_preparation.py
      - src/data/data_cleaning.py
      - data/interim/swiggy_cleaned.csv
    params:
      - data_split
    outs:
      - data/interim/train.csv
      - data/interim/test.csv

  data_preprocessing:
    cmd: python -m src.features.preprocessing
    deps:
      - src/features/preprocessing.py
      - src/features/build_features.py
      - data/interim/train.csv
      - data/interim/test.csv
    params:
      - preprocessing
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
      # cache: false -- this file is tiny (~5KB) and needs to be present in
      # a plain git checkout for Docker builds (Phase 12) without requiring
      # DVC credentials during image build. DVC still tracks it as a stage
      # output for reproducibility bookkeeping, just doesn't store/push its
      # bytes through the DVC remote -- it's committed to git directly.
      - models/preprocessor.joblib:
          cache: false

  train:
    cmd: python -m src.models.train
    deps:
      - src/models/train.py
      - src/models/train_utils.py
      - data/processed/train.csv
    params:
      - train.lightgbm
    outs:
      - models/model.joblib

  evaluation:
    cmd: python -m src.models.evaluate
    deps:
      - src/models/evaluate.py
      - models/model.joblib
      - data/processed/train.csv
      - data/processed/test.csv
    params:
      - train.lightgbm
      - evaluation
    metrics:
      - metrics.json:
          cache: false

  register_model:
    cmd: python -m src.models.register_model
    deps:
      - src/models/register_model.py
      - src/models/train_utils.py
      - metrics.json
    params:
      - registry
      - mlflow
    outs:
      # Without a real output, DVC treats a stage as always-outdated and
      # reruns it on every `dvc repro` regardless of whether deps changed --
      # this file is what makes register_model properly skippable instead
      # of silently registering a duplicate version each time.
      - models/registered_version.json:
          cache: false


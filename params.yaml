# Central place for pipeline hyperparameters and thresholds.
# Every DVC stage reads its inputs from here instead of hardcoding values in scripts.
# Sections are filled in as we build the corresponding phase.

data_cleaning: {}
# Phase 2

data_split:
  test_size: 0.2
  random_state: 42

preprocessing:
  # Ordered categories for genuinely ordinal columns. "Unknown" (the
  # missing-value placeholder from Phase 2) is deliberately NOT part of this
  # order -- it's encoded separately as -1 so it isn't mistaken for "beyond
  # the highest real category" by a linear model.
  ordinal_columns:
    Road_traffic_density: [Low, Medium, High, Jam]
    multiple_deliveries: ["0", "1", "2", "3"]
  onehot_columns:
    - Weatherconditions
    - Type_of_order
    - Type_of_vehicle
    - Festival
    - City
    - time_period

train:
  baseline: {}
  # Phase 5
  random_forest: {}
  # Phase 6
  lightgbm: {}
  # Phase 6
  stacking: {}
  # Phase 6

evaluation: {}
# Phase 8 — MAE threshold for production promotion, with documented rationale

mlflow:
  tracking_uri: https://dagshub.com/adi-awasthi/food-delivery-time-prediction.mlflow
  experiment_name: food-delivery-time-prediction

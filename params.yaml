# Central place for pipeline hyperparameters and thresholds.
# Every DVC stage reads its inputs from here instead of hardcoding values in scripts.

data_cleaning:
  # Empirically verified in Phase 2: across all 43,862 rows where both
  # Time_Orderd and Time_Order_picked are known, the gap between them takes
  # on exactly one of {5, 10, 15} minutes, split almost evenly three ways.
  # Used to impute missing Time_Orderd as Time_Order_picked minus this gap.
  order_to_pickup_imputation_gap_minutes: 10

data_split:
  test_size: 0.2
  random_state: 42

preprocessing:
  # Ordered categories for genuinely ordinal columns. "Unknown" (the
  # missing-value placeholder from Phase 2) is deliberately NOT part of this
  # order -- it's encoded separately as -1 so it isn't mistaken for "beyond
  # the highest real category" by a linear model.
  ordinal_columns:
    Road_traffic_density: [Low, Medium, High, Jam]
    multiple_deliveries: ["0", "1", "2", "3"]
  onehot_columns:
    - Weatherconditions
    - Type_of_order
    - Type_of_vehicle
    - Festival
    - City
    - time_period

train:
  lightgbm:
    # Best config found via RandomizedSearchCV in Phase 6 Step 4
    # (CV MAE 3.089 +/- 0.017, selected over RF/Stacking -- see MLflow run
    # lgbm_tuned_best, tagged selected_for_deployment=true).
    learning_rate: 0.01
    num_leaves: 127
    n_estimators: 500
    reg_alpha: 0.1
    reg_lambda: 0
    random_state: 42

evaluation:
  cv_folds: 5
  # Promotion gate for the model registry (Phase 8): a newly trained model's
  # test_mae must be <= this value to get the "production" alias. Derived
  # from this model's own measured CV noise, not an arbitrary number:
  # current CV MAE mean (3.08846) + 3 * current CV MAE std (0.01695) =
  # 3.139, rounded to 3.14. 3 standard deviations is a standard statistical
  # convention for "this is a real regression, not ordinary retraining
  # noise" (~99.7% confidence), so a future retrain has to be genuinely
  # worse to fail this gate, not just unlucky on one CV split.
  promotion_mae_threshold: 3.14

registry:
  model_name: food-delivery-time-lightgbm

mlflow:
  tracking_uri: https://dagshub.com/adi-awasthi/food-delivery-time-prediction.mlflow
  experiment_name: food-delivery-time-prediction
